```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Integrated Bank Application</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:35px 16px;
  font-family:Arial,sans-serif;color:#111;
  background:white;line-height:1.5
}
.container{
  max-width:750px;margin:auto;
  border:1px solid #bbb;border-radius:12px;
  padding:28px
}
h1{font-size:25px;text-align:center;margin:0 0 8px}
.subtitle{text-align:center;color:#555;margin:0 0 25px}
section{border:1px solid #bbb;border-radius:8px;padding:20px;margin-top:20px}
h2{font-size:18px;margin:0 0 16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
input{
  width:100%;padding:11px;
  border:1px solid #aaa;border-radius:6px;
  font:inherit;background:white;color:#111
}
input:focus{outline:2px solid #555;outline-offset:1px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}
button{
  padding:10px 15px;border:1px solid #555;
  border-radius:6px;background:white;color:#111;
  font-weight:600;cursor:pointer
}
button:hover{outline:1px solid #111}
.output{margin-top:22px;padding:18px;border:1px solid #bbb;border-radius:8px}
.output h2{margin:0 0 10px}
#msg{margin:0;overflow-wrap:anywhere}
#out{margin-top:12px;overflow-wrap:anywhere}
@media(max-width:550px){
 .container{padding:17px}
 section{padding:14px}
 .form-grid{grid-template-columns:1fr}
 .actions button{flex:1 1 40%}
}
</style>
</head>
<body>
<div class="container">
<h1>Integrated Bank Application</h1>
<p class="subtitle">Customer and Account Management System</p>

<section>
<h2>Login and Profile</h2>
<div class="form-grid">
<div>
<label for="id">Account ID</label>
<input id="id" type="number" value="101">
</div>
<div>
<label for="pin">PIN</label>
<input id="pin" type="password" value="1234">
</div>
</div>
<div class="actions">
<button onclick="login()">Login</button>
<button onclick="profile()">View Profile</button>
<button onclick="balance()">Balance Enquiry</button>
<button onclick="logout()">Logout</button>
</div>
</section>

<section>
<h2>Deposit and Withdrawal</h2>
<label for="amount">Transaction Amount (₹)</label>
<input id="amount" type="number" value="500">
<div class="actions">
<button onclick="transact('Deposit')">Deposit</button>
<button onclick="transact('Withdraw')">Withdraw</button>
<button onclick="history()">Transaction History</button>
</div>
</section>

<section>
<h2>Account Management</h2>
<label for="newpin">New PIN</label>
<input id="newpin" type="password" placeholder="Enter 4-digit PIN">
<div class="actions">
<button onclick="changePin()">Change PIN</button>
<button onclick="addAccount()">Add Customer</button>
<button onclick="deleteAccount()">Delete Customer</button>
<button onclick="contact()">Contact Us</button>
</div>
</section>

<div class="output" aria-live="polite">
<h2>Output and Status</h2>
<p id="msg">Welcome! Please login to continue.</p>
<div id="out"></div>
</div>
</div>

<script>
let accounts=[{id:101,name:"Arun Kumar",pin:"1234",balance:5000}];
let transactions=[],logged=null;

function login(){
 let a=accounts.find(a=>a.id==id.value&&a.pin===pin.value);
 if(a){
  logged=a;msg.textContent="Login successful.";
  out.textContent="Welcome, "+a.name;
 }else{
  logged=null;msg.textContent="Error: Invalid account or PIN";
  out.textContent="";
 }
}
function profile(){
 if(!logged)return msg.textContent="Please login first.";
 msg.textContent="Customer Profile";
 out.textContent="Account ID: "+logged.id+" | Name: "+logged.name;
}
function balance(){
 if(!logged)return msg.textContent="Please login first.";
 msg.textContent="Available Balance: ₹"+logged.balance.toFixed(2);
}
function transact(type){
 if(!logged)return msg.textContent="Please login first.";
 let n=Number(amount.value);
 if(!Number.isFinite(n)||n<=0)
  return msg.textContent="Error: Enter a valid amount.";
 if(type==="Withdraw"&&n>logged.balance)
  return msg.textContent="Error: Insufficient balance.";
 logged.balance+=type==="Deposit"?n:-n;
 transactions.push({id:logged.id,type,amount:n});
 msg.textContent=type+" successful. Balance: ₹"+logged.balance.toFixed(2);
}
function changePin(){
 if(!logged)return msg.textContent="Please login first.";
 if(!/^\d{4}$/.test(newpin.value))
  return msg.textContent="Error: Enter a 4-digit PIN.";
 logged.pin=newpin.value;pin.value=newpin.value;
 msg.textContent="PIN changed successfully.";
}
function history(){
 if(!logged)return msg.textContent="Please login first.";
 out.replaceChildren();
 let list=transactions.filter(t=>t.id===logged.id);
 list.forEach(t=>{
  let p=document.createElement("p");
  p.textContent=t.type+" — ₹"+t.amount;
  out.appendChild(p);
 });
 if(!list.length)out.textContent="No transactions available.";
}
function addAccount(){
 let n=Number(prompt("Enter new account ID"));
 if(!n||accounts.some(a=>a.id===n))
  return msg.textContent="Error: Invalid or existing account ID.";
 let name=prompt("Enter customer name");
 accounts.push({id:n,name:name||"Customer",pin:"1234",balance:0});
 msg.textContent="Customer added. Initial PIN: 1234.";
}
function deleteAccount(){
 if(!logged)return msg.textContent="Please login first.";
 accounts=accounts.filter(a=>a.id!==logged.id);
 logged=null;msg.textContent="Account deleted successfully.";
 out.textContent="";
}
function contact(){
 msg.textContent="Contact Us";
 out.textContent="Email: support@bank.com | Phone: 1800-000-000";
}
function logout(){
 logged=null;pin.value="";
 msg.textContent="Logged out successfully.";
 out.textContent="";
}
</script>
</body>
</html>
