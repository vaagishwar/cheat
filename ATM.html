<!DOCTYPE html>
<html>
<head>
<title>ATM Management</title>
<style>
body{font-family:Arial;margin:30px}
main{max-width:450px;margin:auto;border:1px solid;padding:20px}
input,button{padding:8px;margin:5px}
input{width:90%;box-sizing:border-box}
button{cursor:pointer}
#msg{margin-top:15px}
</style>
</head>
<body>
<main>
<h2>ATM Transaction Management</h2>
<label>Account ID</label>
<input id="id" value="101">
<label>PIN</label>
<input id="pin" type="password">
<label>Amount</label>
<input id="amount" type="number">
<button onclick="balance()">Balance Enquiry</button>
<button onclick="transact('Deposit')">Deposit</button>
<button onclick="transact('Withdraw')">Withdraw</button>
<button onclick="changePin()">Change PIN</button>
<button onclick="history()">Transactions</button>
<p id="msg">Welcome</p>
<div id="out"></div>
</main>
<script>
let account={id:101,pin:"1234",balance:5000};
let transactions=[];
function valid(){
 if(id.value!=account.id||pin.value!==account.pin){
 msg.textContent="Invalid account or PIN";return false;
 }return true;
}
function balance(){
 if(valid())msg.textContent="Balance: ₹"+account.balance;
}
function transact(type){
 if(!valid())return;
 let a=Number(amount.value);
 if(a<=0)return msg.textContent="Enter valid amount";
 if(type==="Withdraw"&&a>account.balance)
 return msg.textContent="Insufficient balance";
 account.balance+=type==="Deposit"?a:-a;
 transactions.push(type+" - ₹"+a);
 msg.textContent=type+" successful. Balance: ₹"+account.balance;
}
function changePin(){
 if(!valid())return;
 let p=prompt("Enter new 4-digit PIN");
 if(p&&/^\d{4}$/.test(p)){
 account.pin=p;pin.value=p;
 msg.textContent="PIN changed successfully";
 }else msg.textContent="Invalid PIN";
}
function history(){
 if(!valid())return;
 out.replaceChildren();
 transactions.forEach(t=>{
 let p=document.createElement("p");p.textContent=t;out.appendChild(p);
 });
 if(!transactions.length)out.textContent="No transactions";
}
</script>
</body>
</html>
